[workspace]
members = [
    "solx",
    "solx-core",
    "solx-standard-json",
    "solx-evm-assembly",
    "solx-yul",
    "solx-codegen-evm",
    "solx-utils",
    "solx-dev",
    "solx-tester",
    "solx-benchmark-converter",
    "solx-solc-test-adapter",
    "solx-compiler-downloader",
]
resolver = "3"

[workspace.package]
authors = [
    "Matter Labs <alex@nomic.foundation>",
    "Nomic Foundation <alex@nomic.foundation>",
]
edition = "2024"
version = "0.1.8"

[workspace.dependencies]
# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
serde_yaml = "0.9"
ciborium = "0.2"

# CLI
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"

# Concurrency
rayon = "1.12"

# Utilities
semver = { version = "1.0", features = ["serde"] }
gimli = "0.34"
hex = "0.4"
num = "0.4"
object = "0.40"
regex = "1.12"
glob = "0.3"
itertools = "0.15"
sha2 = "0.11"
sha3 = "0.12"
md5 = "0.8"
alloy-primitives = "1.6"

# LLVM
[workspace.dependencies.inkwell]
git = "https://github.com/NomicFoundation/inkwell"
rev = "0081bb29a84921447fb1c9773350c52813a7fe31"
default-features = false
features = [
    "llvm21-1",
    "serde",
    "no-libffi-linking",
    "target-evm",
]
