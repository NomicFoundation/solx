[package]
name = "slang"
authors.workspace = true
edition.workspace = true
version.workspace = true
description = "LLVM-based Solidity compiler for the EVM"
license = "GPL-3.0-only"

[[bin]]
name = "slang"
path = "src/slang.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
libc = "0.2"
libmimalloc-sys = "0.1"
mimalloc = { version = "0.1", features = ["override"] }

solx-core = { path = "../solx-core" }
solx-slang = { path = "../solx-slang" }
solx-standard-json = { path = "../solx-standard-json" }
solx-utils = { path = "../solx-utils" }

[package.metadata.cargo-udeps.ignore]
# Used by release builds and build.rs, which debug builds skip.
normal = ["libmimalloc-sys", "mimalloc"]

[build-dependencies]
cc = "1.2.60"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
test-case = "3.3"
trycmd = "1.2"

gimli.workspace = true
hex.workspace = true
inkwell.workspace = true
object.workspace = true
regex.workspace = true

solx-codegen-evm = { path = "../solx-codegen-evm" }
