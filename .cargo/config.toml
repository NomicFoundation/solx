[build]
rustflags = [
    "-W", "missing_docs",
]
incremental = true

[target.x86_64-apple-darwin]
rustflags = [
    "-W", "missing_docs",
    "-C", "link-arg=-mmacosx-version-min=12.0",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-W", "missing_docs",
    "-C", "link-arg=-mmacosx-version-min=12.0",
]

[profile.release]
strip = true

[env]
LLVM_SYS_211_PREFIX = { value = "./target-llvm/target-final/", relative = true, force = true }
MLIR_SYS_210_PREFIX = { value = "./target-llvm/target-final/", relative = true, force = true }
TABLEGEN_210_PREFIX = { value = "./target-llvm/target-final/", relative = true }
# MI_PROFILE=0 disables mimalloc's profiler.
# MI_MINGW_UCRT64=1: on MinGW without it, both mimalloc's TLS callback and
# its constructor run process init, and the second run writes a stray newline
# to stderr.
# TODO: microsoft/mimalloc@baa25c5 fixes this upstream, but no release
# includes it yet; drop MI_MINGW_UCRT64=1 after updating to one.
MIMALLOC_DEFINES = "MI_PROFILE=0 MI_MINGW_UCRT64=1"

[alias]
run-tester = "run --bin solx-tester -- --solidity-compiler ./target/release/slang -O M3B3"
