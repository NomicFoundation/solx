[advisories]
yanked = "deny"

# RUSTSEC-2026-0387: crypto-bigint 0.5 has secret-dependent branches in operations
# meant to be constant-time, and the only patched release is 0.7.6. The crate
# arrives solely through revm -> alloy-eip7702/alloy-primitives -> k256 0.13 ->
# elliptic-curve 0.13, and the newest alloy-primitives (1.7.3) and alloy-eip7702
# (0.6.3) still require k256 ^0.13; k256 0.14 is the first to use crypto-bigint
# 0.7. Only solx-tester links it, where the integers are test fixtures and the
# signatures it checks are public test data, so the side channel has no secret to
# leak. Drop this entry once alloy and revm move to k256 0.14.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 is pinned by k256 0.13 under revm; the tester handles no secrets, see comment above" },
]

[licenses]
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unlicense",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[[licenses.clarify]]
name = "mlir-sys"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x0637b9b4 }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Transitive duplicates not under our control.
skip = [
    { crate = "arrayvec" },
    { crate = "block-buffer" },
    { crate = "convert_case" },
    { crate = "derive_more" },
    { crate = "digest" },
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "itertools" },
    { crate = "rand" },
    { crate = "rand_chacha" },
    { crate = "rand_core" },
    { crate = "rlp" },
    { crate = "secp256k1" },
    { crate = "secp256k1-sys" },
    { crate = "sha2" },
    { crate = "sha3" },
    { crate = "syn" },
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    { crate = "toml_datetime" },
    { crate = "toml_edit" },
    { crate = "unsigned-varint" },
    { crate = "windows-sys" },
    { crate = "windows-targets" },
    { crate = "windows_aarch64_gnullvm" },
    { crate = "windows_aarch64_msvc" },
    { crate = "windows_i686_gnu" },
    { crate = "windows_i686_gnullvm" },
    { crate = "windows_i686_msvc" },
    { crate = "windows_x86_64_gnu" },
    { crate = "windows_x86_64_gnullvm" },
    { crate = "windows_x86_64_msvc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/microsoft/mimalloc",
    "https://github.com/NomicFoundation/slang",
    "https://github.com/NomicFoundation/inkwell",
    "https://github.com/NomicFoundation/llvm-sys.rs",
    "https://github.com/NomicFoundation/melior",
    "https://github.com/mlir-rs/tblgen-rs",
]
