[advisories]
yanked = "deny"

# arrayref 0.3.5-0.3.9 -- every version satisfying our dependents' ^0.3.5
# (blake2b_simd/blake2s_simd) and ^0.3.6 (revm-precompile) -- were yanked on
# 2026-08-20, leaving 0.3.10 as the only resolvable version. 0.3.10 adds a
# dependency on `proc-macro1`, a typosquat of proc-macro2 pulling in ureq and
# rustls, which crates.io has since deleted outright rather than yanked. Its
# src/lib.rs is byte-identical to 0.3.9's and it has no corresponding upstream
# commit or tag, so the release carries no fix -- only the new dependency.
# Hold at 0.3.9 and do NOT run `cargo update -p arrayref`, which cargo-deny's
# own error message suggests. Drop this entry once a clean version ships or the
# yanks are reverted.
ignore = [
    { crate = "arrayref@0.3.9", reason = "yanked to force resolution onto the compromised 0.3.10; see comment above" },
]

[licenses]
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unlicense",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[[licenses.clarify]]
name = "mlir-sys"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x0637b9b4 }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Transitive duplicates not under our control.
skip = [
    { crate = "arrayvec" },
    { crate = "block-buffer" },
    { crate = "convert_case" },
    { crate = "derive_more" },
    { crate = "digest" },
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "itertools" },
    { crate = "rand" },
    { crate = "rand_chacha" },
    { crate = "rand_core" },
    { crate = "rlp" },
    { crate = "secp256k1" },
    { crate = "secp256k1-sys" },
    { crate = "sha2" },
    { crate = "sha3" },
    { crate = "syn" },
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    { crate = "toml_datetime" },
    { crate = "toml_edit" },
    { crate = "unsigned-varint" },
    { crate = "windows-sys" },
    { crate = "windows-targets" },
    { crate = "windows_aarch64_gnullvm" },
    { crate = "windows_aarch64_msvc" },
    { crate = "windows_i686_gnu" },
    { crate = "windows_i686_gnullvm" },
    { crate = "windows_i686_msvc" },
    { crate = "windows_x86_64_gnu" },
    { crate = "windows_x86_64_gnullvm" },
    { crate = "windows_x86_64_msvc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/NomicFoundation/inkwell",
    "https://github.com/NomicFoundation/llvm-sys.rs",
    "https://github.com/NomicFoundation/melior",
    "https://github.com/NomicFoundation/slang",
]
