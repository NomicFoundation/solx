name: 'Install msys2'
description: 'Prepares msys2 for Windows builds.'
inputs:
  packages:
    description: 'Packages to install with pacman.'
    required: false
    default: >-
      base-devel
      git
      mingw-w64-x86_64-clang
      mingw-w64-x86_64-lld
      mingw-w64-x86_64-cmake
      mingw-w64-x86_64-ninja
      mingw-w64-x86_64-gcc
      mingw-w64-x86_64-gcc-libs
      mingw-w64-x86_64-headers-git
      mingw-w64-x86_64-python
runs:
  using: composite
  steps:
    # The MSYS2 base is pinned via the setup-msys2 action version: each release
    # hardcodes a specific msys2-installer release in its bundled index.js
    # (v2.31.1 → 2026-03-22). `update: false` skips the per-run `pacman -Syu`
    # that would otherwise pull whatever MSYS2 head looks like today. Two
    # reasons:
    #
    # 1. CCACHE_COMPILERCHECK=content in build-llvm/action.yml hashes the
    #    clang binary's bytes — uncontrolled MSYS2 refreshes invalidated the
    #    Windows ccache wholesale.
    # 2. Prior history of MSYS2 auto-updates silently breaking the build
    #    (libstdc++ incident, which led to switching to rustup's vendored
    #    MinGW for that lib).
    #
    # Bumping the MSYS2 snapshot is an explicit setup-msys2 SHA bump. The
    # `packages` installed on top still come from the live repos, so a clang
    # update there invalidates the ccache regardless.
    - name: Setup msys2 (pinned)
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      id: msys2
      # MSYS2 mirrors intermittently stall or rate-limit package downloads.
      continue-on-error: true
      with:
        path-type: inherit
        update: false
        cache: true
        install: ${{ inputs.packages }}

    # setup-msys2 refuses to install over an existing msys64 directory.
    - name: Remove partial msys2 install
      if: steps.msys2.outcome == 'failure'
      shell: bash
      run: rm -rf "${RUNNER_TEMP}/msys64"

    - name: Setup msys2 (pinned, retry)
      if: steps.msys2.outcome == 'failure'
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        path-type: inherit
        update: false
        cache: true
        install: ${{ inputs.packages }}

    - name: Prepare env
      shell: msys2 {0}
      run: |
        # cargo's libgit2 enforces the 260-char MAX_PATH when checking out
        # git dependencies, and slang's generated snapshot paths exceed it.
        # Written here so it lands in the msys2 HOME that the `msys2 {0}`
        # cargo steps resolve as the global git config.
        git config --global core.longpaths true
        rustup set default-host x86_64-pc-windows-gnu
        echo '${{ runner.temp }}\msys64\mingw64\bin' >> "${GITHUB_PATH}"
        echo "${USERPROFILE}\\.cargo\\bin" >> "${GITHUB_PATH}"

    # Added to GITHUB_PATH after mingw64\bin, so it lands earlier in PATH:
    # non-msys2 steps must resolve python3 to the stock CPython, not the
    # pip-less MinGW python that mingw-w64-x86_64-python puts in mingw64\bin.
    # TODO: Move to Python 3.15 once publish-unit-test-result-action requires
    # lxml >= 6.1.3, the first release with CPython 3.15 Windows wheels, and
    # drop the matching rule in renovate.json.
    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
