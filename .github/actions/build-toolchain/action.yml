name: Build toolchain
description: >-
  Shared CI prologue for the standard toolchain configuration: submodule
  checkout, Socket Firewall, platform prep (MSYS2 on Windows, disk cleanup
  on macOS), then the LLVM build. The build parameters below define the
  standard-config cache keys shared by test.yaml and cache-warmup.yaml —
  changing them here re-keys both workflows together. Workflows needing a
  different LLVM configuration (sanitizer, coverage, integration, release)
  call build-llvm directly and pair with their own cache-warmup job.

inputs:
  llvm:
    description: Whether to build LLVM
    required: false
    default: 'true'
  refresh-ccache:
    description: Passed to build-llvm
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Checkout submodules
      uses: ./.github/actions/checkout-submodules

    - name: Setup SFW (optional)
      uses: ./.github/actions/setup-sfw
      with:
        optional: 'true'

    - name: Prepare Windows env
      if: runner.os == 'Windows'
      uses: ./.github/actions/prepare-msys

    - name: Free disk space (macOS)
      if: runner.os == 'macOS'
      uses: ./.github/actions/free-disk-space-macos

    - name: Build LLVM
      if: inputs.llvm == 'true'
      uses: ./.github/actions/build-llvm
      with:
        build-type: RelWithDebInfo
        enable-assertions: 'true'
        enable-utils: 'true'
        refresh-ccache: ${{ inputs.refresh-ccache }}
