name: Setup Rust
description: Sets up Rust toolchain declaratively via rust-toolchain.toml
inputs:
  toolchain:
    description: Rust toolchain to install (empty = use rust-toolchain.toml)
    required: false
    default: ''
  target:
    description: Target triple to install for this toolchain
    required: false
    default: ''
  components:
    description: Comma-separated components to install
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        toolchain: ${{ inputs.toolchain }}
        target: ${{ inputs.target }}
        components: ${{ inputs.components }}
        cache: false
        rustflags: ""
        build-warnings: ""
        override: false
