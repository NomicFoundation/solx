name: Sanitizer

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  label-check:
    # Checks the PR's current label set, not the triggering action: keying on
    # github.event.label.name would skip this run (and cancel a real one in
    # flight) when an unrelated label is added to a PR carrying ci:sanitizer.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ci:sanitizer')
      && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'

  changes:
    needs: label-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history for the filter's git-diff mode.
          fetch-depth: 0
      - uses: ./.github/actions/code-changes
        id: filter

  cooldown-check:
    name: Cargo cooldown check
    runs-on: ubuntu-24.04
    needs: [label-check, changes]
    # A custom if: overrides the implicit skip cascade from needs
    # (actions/runner#491), so the label gate must be restated here.
    if: needs.label-check.result == 'success' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/cooldown-check

  sanitizer:
    needs: [label-check, cooldown-check]
    runs-on: solx-linux-amd64-self-hosted
    # checks: write for the rust-unit-tests action's test-results check run.
    permissions:
      contents: read
      checks: write
      packages: read
    container:
      image: ghcr.io/nomicfoundation/solx-ci-runner@sha256:cd5a37f2630fdf1898ddb2ca11f8c2ecc4d572c60011fe923b27b1625f92ba15
      options: -m 110g
    env:
      TARGET: x86_64-unknown-linux-gnu
      RUST_SANITIZER: 'address'
      LLVM_SANITIZER: 'Address'
      CARGO_TARGET_DIR: target-slang
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false

      - name: Checkout submodules
        uses: ./.github/actions/checkout-submodules

      - name: Setup SFW (optional)
        uses: ./.github/actions/setup-sfw
        with:
          optional: 'true'

      - name: Build LLVM
        uses: ./.github/actions/build-llvm
        with:
          build-type: RelWithDebInfo
          sanitizer: ${{ env.LLVM_SANITIZER }}
          enable-assertions: 'true'
          enable-mlir: 'true'

      - name: Run tests
        uses: ./.github/actions/rust-unit-tests
        with:
          target: ${{ env.TARGET }}
          sanitizer: ${{ env.RUST_SANITIZER }}
          cargo-test-command: test-slang

  pr-checks:
    name: PR Checks (Sanitizer)
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - label-check
      - changes
      - cooldown-check
      - sanitizer
    steps:
      - name: Decide on PR checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            ${{ needs.label-check.result == 'skipped' && 'label-check, changes, cooldown-check, sanitizer'
            || needs.changes.outputs.code != 'true' && 'cooldown-check, sanitizer'
            || '' }}
