name: Compile Benchmark

# Times `slang --standard-json` over the fixtures in tests/benchmark/fixtures
# with hyperfine, comparing the PR merged into its base branch against main and
# a pinned prerelease binary, and posts the report as a PR comment. Report-only
# (no pass/fail gating on timings).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -ex {0}

jobs:

  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for the filter's git-diff mode.
          fetch-depth: 0
      - uses: ./.github/actions/code-changes
        id: filter

  cooldown-check:
    name: Cargo cooldown check
    runs-on: ubuntu-26.04
    needs: changes
    # On workflow_dispatch the filter sees only the last commit.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (needs.changes.outputs.code == 'true' && !github.event.pull_request.head.repo.fork)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cooldown-check

  compile-benchmark:
    needs: cooldown-check
    permissions:
      actions: read
      contents: read
      pull-requests: write
      packages: read
    runs-on: solx-f4-staging
    container:
      image: ghcr.io/nomicfoundation/solx-ci-runner@sha256:7cc8aba2983f6feb71f046876611b48e9649e72acdfcdbcad756e2030c3a356a
      options: -m 48g
    # Warm caches: ~10 min builds + ~20 min benchmark. Worst case: a PR that
    # bumps solx-llvm (or its build scripts) builds both the PR and main LLVM
    # cold, sequentially.
    timeout-minutes: 180
    steps:
      # On pull_request, the default ref is GitHub's test merge of the PR into
      # its base branch, so commits main gained since the PR branched off are
      # not counted as the PR's effect.
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # actions/checkout's `git clean -ffdx` doesn't recurse into submodules,
      # so on a persistent self-hosted workspace a previous run can leave
      # stale dirs inside temp-solx-main. Wipe wholesale before re-checking
      # out main. (Same pattern as integration-tests.yaml.)
      - name: Reset main checkout dir
        run: rm -rf temp-solx-main

      # The merge commit's own main parent, so a push to main mid-run can't
      # skew the comparison.
      - name: Checkout main
        id: checkout-main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha || 'main' }}
          submodules: true
          persist-credentials: false
          path: temp-solx-main

      - name: Checkout submodules (PR)
        uses: ./.github/actions/checkout-submodules

      - name: Checkout submodules (main)
        uses: ./.github/actions/checkout-submodules
        with:
          working-directory: temp-solx-main

      - name: Setup SFW (optional)
        uses: ./.github/actions/setup-sfw
        with:
          optional: 'true'

      # Release build without assertions: matches the prerelease binary's
      # configuration so the three-way comparison is apples-to-apples.
      - name: Build LLVM
        id: build-llvm-pr
        uses: ./.github/actions/build-llvm
        with:
          build-type: Release
          enable-assertions: 'false'

      - name: Build LLVM (main)
        uses: ./.github/actions/build-llvm
        with:
          working-dir: temp-solx-main
          mirror-key: ${{ steps.build-llvm-pr.outputs.cache-key }}
          build-type: Release
          enable-assertions: 'false'

      # Env and target mirror .github/actions/build-rust so the pr/main
      # binaries share the prerelease binary's build configuration: the
      # statically linked glibc alone is worth ~5% on this workload.
      - name: Build solx (PR)
        env:
          RUSTC_BOOTSTRAP: 1
          RUSTFLAGS: '-C target-feature=+crt-static -C link-arg=-fuse-ld=lld'
        run: |
          ${SFW_PREFIX:-} cargo fetch --locked
          ${SFW_PREFIX:-} cargo build --frozen --release --target x86_64-unknown-linux-gnu

      - name: Build solx (main)
        working-directory: temp-solx-main
        env:
          RUSTC_BOOTSTRAP: 1
          RUSTFLAGS: '-C target-feature=+crt-static -C link-arg=-fuse-ld=lld'
        run: |
          ${SFW_PREFIX:-} cargo fetch --locked
          ${SFW_PREFIX:-} cargo build --frozen --release --target x86_64-unknown-linux-gnu

      # A fixed reference point across PRs; bump all three values to move it.
      - name: Download prerelease binary
        env:
          TAG: 5e6ec5e1
          ASSET: slang-linux-amd64-gnu-debug-fast
          SHA256: 0b47a9cc237a52dd1eb53bfb4dcfcc5cde755a48661a9df964d91f94c1a42b3f
        run: |
          curl -fsSL --retry 3 -o slang-prerelease \
            "https://github.com/NomicFoundation/solx/releases/download/${TAG}/${ASSET}"
          echo "${SHA256}  slang-prerelease" | sha256sum -c -
          chmod +x slang-prerelease
          ./slang-prerelease --version

      # A sweep is ~5 s per binary. ENS compiles in ~0.5 s and single runs
      # spike by up to 8%, so it takes 10 runs to keep one spike from showing.
      - name: Run benchmark
        env:
          RUNNER_NAME: ${{ runner.name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MAIN_SHA: ${{ steps.checkout-main.outputs.commit }}
        run: |
          ./tests/benchmark/run.sh \
            --bin pr=./target/x86_64-unknown-linux-gnu/release/slang \
            --bin main=./temp-solx-main/target/x86_64-unknown-linux-gnu/release/slang \
            --bin prerelease=./slang-prerelease \
            --runs 10 --warmup 1 \
            --out benchmark-out
          python3 ./tests/benchmark/report.py --dir benchmark-out --out benchmark-out/report.md

      - name: Post benchmark report comment
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: 'compile-benchmark-report'
          message-path: benchmark-out/report.md

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compile-benchmark-results
          path: benchmark-out/

      - name: Container memory peak
        if: always()
        run: echo "memory.peak $(( $(cat /sys/fs/cgroup/memory.peak) / 1024 / 1024 / 1024 )) GiB"
