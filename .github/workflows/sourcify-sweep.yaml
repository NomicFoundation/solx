name: Sourcify Sweep

# Report-only: frontend failures never fail the run, only harness breakage does.
#
# The corpus release is pinned in solx-dev/sourcify-tests.toml, and the reference
# compiler in solx-compiler-downloader/dev-compilers.json.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes group by SHA: GitHub keeps one pending run per group, so a
  # shared main group would drop queued pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -ex {0}

env:
  SHARD_COUNT: 24

jobs:

  label-check:
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'ci:sourcify-sweep')
        && (github.event.action != 'labeled' || github.event.label.name == 'ci:sourcify-sweep')
        && !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-26.04
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - id: shards
        run: echo "list=$(jq -nc '[range(env.SHARD_COUNT | tonumber)]')" >> "${GITHUB_OUTPUT}"

  cooldown-check:
    name: Cargo cooldown check
    runs-on: ubuntu-26.04
    needs: label-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/cooldown-check

  build:
    name: Build
    needs: cooldown-check
    permissions:
      actions: read
      contents: read
      packages: read
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nomicfoundation/solx-ci-runner@sha256:7cc8aba2983f6feb71f046876611b48e9649e72acdfcdbcad756e2030c3a356a
      # Same host bind-mounts as test.yaml's cargo-checks job so the
      # free-disk-space-linux action can reclaim room for the LLVM tree.
      volumes:
        - /usr/share/dotnet:/mnt/free-disk-space/dotnet
        - /usr/local/lib/android:/mnt/free-disk-space/android
        - /opt/ghc:/mnt/free-disk-space/ghc
        - /usr/local/.ghcup:/mnt/free-disk-space/ghcup
        - /opt/hostedtoolcache/CodeQL:/mnt/free-disk-space/codeql
    # A cold LLVM build (solx-llvm bump on the PR) takes well over an hour.
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false

      - name: Free disk space (Linux)
        uses: ./.github/actions/free-disk-space-linux

      # Standard toolchain configuration (RelWithDebInfo + assertions + MLIR):
      # the LLVM cache that cache-warmup.yaml keeps warm on hosted runners.
      - name: Build toolchain
        uses: ./.github/actions/build-toolchain

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: sourcify-sweep-v1
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build slang and solx-dev
        run: |
          ${SFW_PREFIX:-} cargo fetch --locked
          ${SFW_PREFIX:-} cargo build --frozen --release --bin slang --bin solx-dev

      # upload-artifact drops file modes, so the binaries travel as a tar.
      - name: Pack binaries
        run: tar -cf "${RUNNER_TEMP}/binaries.tar" target/release/slang target/release/solx-dev

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sourcify-sweep-binaries
          path: ${{ runner.temp }}/binaries.tar
          retention-days: 7

  # Shards run on the host, whose Ubuntu release matches the CI image the binaries were built in.
  sweep:
    name: Sweep shard ${{ matrix.shard }}
    needs: [label-check, build]
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.label-check.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            solx-dev/sourcify-tests.toml
            solx-compiler-downloader/dev-compilers.json
          sparse-checkout-cone-mode: false

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sourcify-sweep-binaries
          path: ${{ runner.temp }}

      - name: Unpack binaries
        run: tar -xf "${RUNNER_TEMP}/binaries.tar"

      - name: Run the sweep shard
        id: sweep
        run: |
          ./target/release/solx-dev test sourcify \
            --corpus-dir "${RUNNER_TEMP}/corpus" \
            --output-path "${RUNNER_TEMP}/results-shard-${SHARD}.jsonl" \
            --shard-count "${SHARD_COUNT}" \
            --shard-index "${SHARD}" \
            --threads 4 \
            --memory-limit-mib 6144

      # Results are written one line per contract, so a shard that died keeps what it swept.
      - name: Upload shard results
        if: ${{ always() && steps.sweep.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sourcify-sweep-results-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results-shard-${{ matrix.shard }}.jsonl
          if-no-files-found: error

  summarize:
    name: Summarize
    needs: sweep
    if: ${{ !cancelled() && needs.sweep.result != 'skipped' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sourcify-sweep-binaries
          path: ${{ runner.temp }}

      - name: Download shard results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sourcify-sweep-results-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      # The report covers every shard that uploaded results; a shard that failed has already
      # failed the run.
      - name: Combine shards and report
        env:
          SWEEP_RESULT: ${{ needs.sweep.result }}
        run: |
          title="Sourcify sweep"
          if [ "${SWEEP_RESULT}" != "success" ]; then
            title="${title} (partial: a shard failed)"
          fi
          cat "${RUNNER_TEMP}"/shards/results-shard-*.jsonl > "${RUNNER_TEMP}/results.jsonl"
          tar -xf "${RUNNER_TEMP}/binaries.tar" -C "${RUNNER_TEMP}" target/release/solx-dev
          "${RUNNER_TEMP}/target/release/solx-dev" test sourcify-report \
            --results-path "${RUNNER_TEMP}/results.jsonl" \
            --output-path "${RUNNER_TEMP}/report.md" \
            --title "${title}"
          cat "${RUNNER_TEMP}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Post report comment
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: 'sourcify-sweep-report'
          message-path: ${{ runner.temp }}/report.md

      - name: Upload combined results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sourcify-sweep-results
          path: |
            ${{ runner.temp }}/results.jsonl
            ${{ runner.temp }}/report.md
