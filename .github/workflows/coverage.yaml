name: Code coverage

on:
  pull_request:
  # Trunk runs upload the Codecov base for PR deltas and save the cargo cache
  # that PR runs restore (rust-cache save-if only fires on refs/heads/main).
  push:
    branches:
      - main

concurrency:
  group: ${{ github.repository_id }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: "bash -ex {0}"

permissions:
  contents: read

jobs:

  cooldown-check:
    name: Cargo cooldown check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cooldown-check

  coverage:
    needs: cooldown-check
    # Fork PRs are rare; their coverage reaches Codecov with the main push
    # after merge.
    if: ${{ github.event_name == 'push' || !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    # Backstop against hung compiles (the tester drives a pipeline still in
    # development); sized for a cold instrumented LLVM build when a solx-llvm
    # bump lands before cache-warmup has run for that SHA.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nomicfoundation/solx-ci-runner@sha256:cd5a37f2630fdf1898ddb2ca11f8c2ecc4d572c60011fe923b27b1625f92ba15
      # Host tooling bind-mounts for the free-disk-space-linux action, needed
      # when a solx-llvm bump forces a cold LLVM build before cache-warmup has
      # run for that SHA. Keep in sync with the matching lists in test.yaml
      # and cache-warmup.yaml.
      volumes:
        - /usr/share/dotnet:/mnt/free-disk-space/dotnet
        - /usr/local/lib/android:/mnt/free-disk-space/android
        - /opt/ghc:/mnt/free-disk-space/ghc
        - /usr/local/.ghcup:/mnt/free-disk-space/ghcup
        - /opt/hostedtoolcache/CodeQL:/mnt/free-disk-space/codeql
    env:
      PROFDATA_FILE: solx.profdata
      LCOV_FILE: codecov.lcov
      LCOV_FILE_LLVM: codecov-llvm-fork.lcov
      OUTPUT_HTML_DIR: COVERAGE
      OUTPUT_HTML_DIR_LLVM: COVERAGE-LLVM
      # ^/rustc/ = std sources monomorphized into our binaries; the remapped
      # path exists on no runner, so llvm-cov show errors trying to render it.
      COVERAGE_IGNORE_REGEX: '/(solx-llvm|target-llvm|\.cargo|cargo/registry)/|^/rustc/'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Free disk space (Linux)
        uses: ./.github/actions/free-disk-space-linux

      - name: Checkout submodules
        uses: ./.github/actions/checkout-submodules

      - name: Setup SFW (optional)
        uses: ./.github/actions/setup-sfw
        with:
          optional: 'true'

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: coverage-v1
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build LLVM
        uses: ./.github/actions/build-llvm
        with:
          build-type: 'Release'
          enable-assertions: 'false'
          enable-coverage: 'true'

      - name: Build solx
        id: build-solx
        uses: ./.github/actions/build-rust
        with:
          build-type: 'release'
          enable-coverage: 'true'
          target: 'x86_64-unknown-linux-gnu'

      - name: Build solx-dev and solx-tester
        env:
          RUSTC_BOOTSTRAP: 1
          RUSTFLAGS: '-C target-feature=+crt-static -C instrument-coverage -C link-arg=-fuse-ld=lld'
        run: ${SFW_PREFIX:-} cargo build --frozen --release -p solx-dev -p solx-tester --target x86_64-unknown-linux-gnu

      - name: Run integration tests
        env:
          SOLX_BINARY: ${{ steps.build-solx.outputs.binary-path }}
          # %Nm without %p: subprocesses merge online into a pool of 4 files
          # instead of clobbering a single default.profraw. The pool is what
          # preserves the solx-llvm C++ counters, which only the spawned solx
          # compile subprocesses exercise.
          LLVM_PROFILE_FILE: 'integration-%4m.profraw'
        run: |
          TMP="${PROFDATA_FILE}.tmp"
          TARGET_DIR="./target/x86_64-unknown-linux-gnu/release"
          for TEST_PATH in tests/solidity/simple/default.sol tests/solidity/complex/default; do
            WORKDIR=$(basename "${TEST_PATH}")
            mkdir -p "${GITHUB_WORKSPACE}/${WORKDIR}"
            "${TARGET_DIR}/solx-dev" test solx-tester \
              --binary "${TARGET_DIR}/solx-tester" \
              --solidity-compiler "${SOLX_BINARY}" \
              --path "${TEST_PATH}" --workflow build --optimizer M3B3 || true
            mv *.profraw "${GITHUB_WORKSPACE}/${WORKDIR}/" || true
            find "${GITHUB_WORKSPACE}/${WORKDIR}" -type f -name '*.profraw' -print > profiles.lst
            if [[ -f "${PROFDATA_FILE}" ]]; then
              llvm-profdata merge -sparse -num-threads="$(nproc)" -o "${TMP}" "${PROFDATA_FILE}" @profiles.lst
            else
              llvm-profdata merge -sparse -num-threads="$(nproc)" -o "${TMP}" @profiles.lst
            fi
            mv -f "${TMP}" "${PROFDATA_FILE}"
            rm -rf "${GITHUB_WORKSPACE}/${WORKDIR:?}"
          done

      - name: Preserve instrumented binary
        env:
          SOLX_BINARY: ${{ steps.build-solx.outputs.binary-path }}
        run: |
          cp "${SOLX_BINARY}" "${GITHUB_WORKSPACE}/solx-instrumented"
          cp "./target/x86_64-unknown-linux-gnu/release/solx-tester" "${GITHUB_WORKSPACE}/solx-tester-instrumented"
          cp "./target/x86_64-unknown-linux-gnu/release/solx-dev" "${GITHUB_WORKSPACE}/solx-dev-instrumented"

      - name: Run unit tests
        env:
          RUSTC_BOOTSTRAP: 1
          RUSTFLAGS: '-C target-feature=+crt-static -C instrument-coverage -C link-arg=-fuse-ld=lld'
          # %Nm without %p: the profile runtime merges profiles online into a
          # pool of 4 files instead of leaving one profraw per process (CLI
          # tests spawn thousands of short-lived solx subprocesses).
          LLVM_PROFILE_FILE: 'unit-tests-%4m.profraw'
        run: ${SFW_PREFIX:-} cargo test --frozen --release --target x86_64-unknown-linux-gnu

      - name: Merge unit test profraw
        run: |
          find . -name 'unit-tests-*.profraw' -print > unit-profiles.lst
          if [ -s unit-profiles.lst ]; then
            TMP="${PROFDATA_FILE}.tmp"
            llvm-profdata merge -sparse -num-threads="$(nproc)" -o "${TMP}" "${PROFDATA_FILE}" @unit-profiles.lst
            mv -f "${TMP}" "${PROFDATA_FILE}"
            find . -name 'unit-tests-*.profraw' -delete
          fi

      - name: Generate coverage reports
        run: |
          OBJECTS=(
            -object "${GITHUB_WORKSPACE}/solx-instrumented"
            -object "${GITHUB_WORKSPACE}/solx-tester-instrumented"
            -object "${GITHUB_WORKSPACE}/solx-dev-instrumented"
          )
          llvm-cov show --show-directory-coverage \
            --format=html --output-dir=${OUTPUT_HTML_DIR} \
            --ignore-filename-regex="${COVERAGE_IGNORE_REGEX}" \
            -instr-profile=${PROFDATA_FILE} "${OBJECTS[@]}"
          mkdir -p llvm
          llvm-cov export --format=lcov \
            --ignore-filename-regex="${COVERAGE_IGNORE_REGEX}" \
            -instr-profile=${PROFDATA_FILE} \
            "${OBJECTS[@]}" > ./llvm/${LCOV_FILE}

      # solx-llvm fork coverage for the LLVM team: same profdata, restricted
      # via positional source paths to the fork-specific sources instead of the
      # ignore regex that keeps them out of the solx report above.
      - name: Generate LLVM fork coverage reports
        id: fork-coverage
        run: |
          # First binary is positional: with -object only, llvm-cov consumes
          # the first positional SOURCE path as the covered binary.
          OBJECTS=(
            "${GITHUB_WORKSPACE}/solx-instrumented"
            -object "${GITHUB_WORKSPACE}/solx-tester-instrumented"
            -object "${GITHUB_WORKSPACE}/solx-dev-instrumented"
          )
          FORK_PATHS=(
            "${GITHUB_WORKSPACE}/solx-llvm/llvm/lib/Target/EVM"
            "${GITHUB_WORKSPACE}/solx-llvm/mlir/lib/Dialect/Sol"
            "${GITHUB_WORKSPACE}/solx-llvm/mlir/lib/Dialect/Yul"
            "${GITHUB_WORKSPACE}/solx-llvm/mlir/lib/Conversion/SolToYul"
            "${GITHUB_WORKSPACE}/solx-llvm/mlir/lib/Conversion/YulToStandard"
            "${GITHUB_WORKSPACE}/solx-llvm/mlir/lib/CAPI/Dialect/Sol.cpp"
            "${GITHUB_WORKSPACE}/solx-llvm/mlir/lib/CAPI/Dialect/SolPasses.cpp"
            "${GITHUB_WORKSPACE}/solx-llvm/mlir/lib/CAPI/Dialect/Yul.cpp"
            "${GITHUB_WORKSPACE}/solx-llvm/mlir/lib/CAPI/Dialect/YulPasses.cpp"
            "${GITHUB_WORKSPACE}/solx-llvm/lld/lld-c"
            "${GITHUB_WORKSPACE}/solx-llvm/lld/ELF/Arch/EVM.cpp"
            "${GITHUB_WORKSPACE}/solx-llvm/llvm/lib/Analysis/VMAliasAnalysis.cpp"
            "${GITHUB_WORKSPACE}/solx-llvm/llvm/lib/Support/KECCAK.cpp"
            "${GITHUB_WORKSPACE}/solx-llvm/llvm/lib/Transforms/Scalar/MergeIdenticalBB.cpp"
            "${GITHUB_WORKSPACE}/solx-llvm/llvm/lib/Transforms/Scalar/SHA3ConstFolding.cpp"
          )
          # llvm-cov only warns on a nonexistent source path, silently dropping
          # the area from every report; fail instead.
          for path in "${FORK_PATHS[@]}"; do
            [ -e "${path}" ] || { echo "::error::fork source path missing: ${path}"; exit 1; }
          done
          llvm-cov show --show-directory-coverage \
            --format=html --output-dir="${OUTPUT_HTML_DIR_LLVM}" \
            -instr-profile="${PROFDATA_FILE}" "${OBJECTS[@]}" "${FORK_PATHS[@]}"
          llvm-cov export --format=lcov \
            -instr-profile="${PROFDATA_FILE}" \
            "${OBJECTS[@]}" "${FORK_PATHS[@]}" > "./llvm/${LCOV_FILE_LLVM}"
          # Paths relative to the solx-llvm root, as its own Codecov project
          # knows them.
          sed -i "s|^SF:${GITHUB_WORKSPACE}/solx-llvm/|SF:|" "./llvm/${LCOV_FILE_LLVM}"
          echo "solx-llvm-sha=$(git -C solx-llvm rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'Coverage integration tests'
          path: |
            ${{ env.OUTPUT_HTML_DIR }}
            llvm/${{ env.LCOV_FILE }}

      - name: Upload LLVM fork coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'Coverage LLVM fork'
          path: |
            ${{ env.OUTPUT_HTML_DIR_LLVM }}
            llvm/${{ env.LCOV_FILE_LLVM }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: 'llvm/codecov.lcov'
          flags: solx
          # Upload only the lcov above; don't walk the tree or run the gcov
          # plugin over the thousands of solx-llvm test fixtures.
          disable_search: true
          plugins: noop
          slug: ${{ github.repository }}
          fail_ci_if_error: true

      # Codecov renders a file's source from the commit it was uploaded to,
      # so the fork coverage goes to solx-llvm's project under the pinned
      # commit. Main pushes only: Codecov merges every upload to a commit,
      # and PRs would mix their runs into the pin's numbers.
      - name: Upload LLVM fork coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN_SOLX_LLVM }}
          files: 'llvm/${{ env.LCOV_FILE_LLVM }}'
          override_commit: ${{ steps.fork-coverage.outputs.solx-llvm-sha }}
          root_dir: solx-llvm
          disable_search: true
          plugins: noop
          slug: NomicFoundation/solx-llvm
          fail_ci_if_error: true
