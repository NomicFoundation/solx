name: Slang Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  label-check:
    # Checks the PR's current label set, not the triggering action: keying on
    # github.event.label.name would skip this run (and cancel a real one in
    # flight) when an unrelated label is added to a PR carrying ci:slang.
    if: >-
      github.event_name == 'push'
      || (contains(github.event.pull_request.labels.*.name, 'ci:slang')
      && !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'

  changes:
    needs: label-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for the filter's git-diff mode.
          fetch-depth: 0
      - uses: ./.github/actions/code-changes
        id: filter

  cooldown-check:
    name: Cargo cooldown check
    runs-on: ubuntu-24.04
    needs: [label-check, changes]
    # A custom if: overrides the implicit skip cascade from needs
    # (actions/runner#491), so the label gate must be restated here.
    if: needs.label-check.result == 'success' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cooldown-check

  slang-tests:
    needs: [label-check, cooldown-check]
    # checks: write for the rust-unit-tests action's test-results check run.
    permissions:
      contents: read
      checks: write
      packages: read
    env:
      CARGO_TARGET_DIR: target-slang
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MacOS x86"
            runner: macos-15-intel
          - name: "MacOS arm64"
            runner: macos-15
          - name: "Linux x86 gnu"
            runner: ubuntu-24.04
            image: ghcr.io/nomicfoundation/solx-ci-runner@sha256:cd5a37f2630fdf1898ddb2ca11f8c2ecc4d572c60011fe923b27b1625f92ba15
            target: "x86_64-unknown-linux-gnu"
          - name: "Linux ARM64 gnu"
            runner: ubuntu-24.04-arm
            image: ghcr.io/nomicfoundation/solx-ci-runner@sha256:cd5a37f2630fdf1898ddb2ca11f8c2ecc4d572c60011fe923b27b1625f92ba15
            target: "aarch64-unknown-linux-gnu"
          - name: "Windows"
            runner: windows-2025
            target: "x86_64-pc-windows-gnu"
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image || '' }}
    name: ${{ matrix.name }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # solc is built separately below: the lit tests need a Release build
      # against a synced solx-solidity, not the standard config.
      - name: Build toolchain
        uses: ./.github/actions/build-toolchain
        with:
          solc: 'false'

      # TODO: remove this step and the Build solc step below once the lit
      # tests stop running against solc.
      - name: Sync solx-solidity for MLIR codegen
        shell: bash
        run: |
          git -C solx-solidity fetch origin main
          git -C solx-solidity checkout FETCH_HEAD

      # Release: RelWithDebInfo bakes -g3 debug info into the statically
      # linked solc.exe, producing a ~2 GB PE that the Windows loader
      # rejects ("Exec format error"), and the lit tests execute solc.
      - name: Build solc
        uses: ./.github/actions/build-solc
        with:
          cmake-build-type: Release
          enable-mlir: 'true'

      # bindgen's embedded clang needs to know it's targeting MinGW,
      # otherwise it can't parse MinGW-specific __attribute__ extensions
      # in stdlib.h (rust-lang/rust-bindgen#1760).
      - name: Set bindgen target for MinGW
        if: runner.os == 'Windows'
        shell: bash
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-w64-windows-gnu" >> "${GITHUB_ENV}"

      - name: Preserve lit tools before disk cleanup
        shell: bash
        run: |
          EXE=${{ runner.os == 'Windows' && '.exe' || '' }}
          LIT=llvm-lit${{ runner.os == 'Windows' && '.py' || '' }}
          mkdir -p "${RUNNER_TEMP}/lit-tools"
          cp -r \
            target-llvm/target-final/bin/FileCheck${EXE} \
            target-llvm/target-final/bin/${LIT} \
            solx-llvm/llvm/utils/lit \
            solx-solidity/build/solc/solc${EXE} \
            "${RUNNER_TEMP}/lit-tools/"
          echo "${RUNNER_TEMP}/lit-tools" >> "${GITHUB_PATH}"
          echo "PYTHONPATH=${RUNNER_TEMP}/lit-tools/lit" >> "${GITHUB_ENV}"

      - name: Free disk space (remove build artifacts before slang tests)
        shell: bash
        run: |
          echo "Before cleanup:" && df -h .
          rm -rf solx-llvm target-llvm/build-final target solx-solidity
          echo "After cleanup:" && df -h .

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: slang-tests-v2
          # `cargo test-slang` writes to target-slang, not target (.cargo/config.toml alias)
          workspaces: ". -> target-slang"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run slang tests
        uses: ./.github/actions/rust-unit-tests
        with:
          target: ${{ matrix.target || '' }}
          cargo-test-command: 'test-slang'
          results-xml: 'slang-unit-tests-results.xml'
          check-name: 'Slang Unit Tests Results'

      - name: Verify lit tools run outside MSYS2
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -la "${RUNNER_TEMP}/lit-tools"
          FileCheck --version
          solc --version

      - name: Run MLIR lit tests
        shell: bash
        env:
          SOLX_LIT_TARGET: ${{ matrix.target || '' }}
        run: |
          LIT=llvm-lit${{ runner.os == 'Windows' && '.py' || '' }}
          ${LIT} -v solx-mlir/tests/lit/

  pr-checks:
    name: PR Checks (Slang)
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - label-check
      - changes
      - cooldown-check
      - slang-tests
    steps:
      - name: Decide on PR checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            ${{ needs.label-check.result == 'skipped' && 'label-check, changes, cooldown-check, slang-tests'
            || needs.changes.outputs.code != 'true' && 'cooldown-check, slang-tests'
            || '' }}
