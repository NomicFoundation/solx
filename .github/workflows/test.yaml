name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Detect whether code (non-doc) files changed
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      devcontainer: ${{ steps.filter-devcontainer.outputs.devcontainer }}
      docs-examples: ${{ steps.filter-docs-examples.outputs.docs-examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for the filters' git-diff mode.
          fetch-depth: 0
      - uses: ./.github/actions/code-changes
        id: filter
      # Separate step: the OR-list below needs the default 'some' quantifier,
      # while the negation-style code filter needs 'every'. The docker dir is
      # included because the devcontainer builds its `base` stage locally;
      # rust-toolchain.toml because the container resolves it lazily on first
      # use; this workflow itself so edits to the validation harness (the
      # validate-devcontainer job, the devcontainers/ci pin) are validated too.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter-devcontainer
        with:
          token: ''
          filters: |
            devcontainer:
              - '.devcontainer/**'
              - '.github/docker/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/test.yaml'
      # The CLI guide and its fixtures are executable test cases (the
      # docs_examples CLI test), but they live under docs/ which the code
      # filter excludes — without this, a docs-only PR would skip the very
      # test that guards it.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter-docs-examples
        with:
          filters: |
            docs-examples:
              - 'docs/src/user-guide/02-command-line-interface.md'
              - 'docs/src/user-guide/02-command-line-interface.in/**'
              - 'docs/src/user-guide/02-command-line-interface.out/**'

  # Smoke-test the devcontainer: the runner Dockerfile's `base` stage and the
  # dev layer build (locally, no registry auth — same flow as a developer
  # machine), the non-root user and volume mounts work, and the pinned Rust
  # toolchain resolves. Deliberately does NOT build LLVM — that stays a
  # documented local step (docs/src/developer-guide/00-development-container.md).
  validate-devcontainer:
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck devcontainer scripts
        run: shellcheck .devcontainer/*.sh

      # Builds the runner Dockerfile's `dev` stage (locally, no registry
      # auth), runs the container lifecycle incl. post-create.sh, then the
      # smoke test inside.
      - name: Build devcontainer and run smoke test
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: .devcontainer/smoke-test.sh

  # Check for cargo issues
  cargo-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nomicfoundation/solx-ci-runner@sha256:cd5a37f2630fdf1898ddb2ca11f8c2ecc4d572c60011fe923b27b1625f92ba15
      # Host tooling bind-mounted so the free-disk-space-linux action can reclaim
      # ~24 GB before the cold LLVM build fills the runner's 14 GB budget.
      # Anchor shared with build-and-test below; keep in sync with the
      # matching list in cache-warmup.yaml.
      volumes: &free-disk-volumes
        - /usr/share/dotnet:/mnt/free-disk-space/dotnet
        - /usr/local/lib/android:/mnt/free-disk-space/android
        - /opt/ghc:/mnt/free-disk-space/ghc
        - /usr/local/.ghcup:/mnt/free-disk-space/ghcup
        - /opt/hostedtoolcache/CodeQL:/mnt/free-disk-space/codeql
    steps:

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Free disk space (Linux)
        uses: ./.github/actions/free-disk-space-linux

      - name: Build toolchain
        uses: ./.github/actions/build-toolchain
        with:
          solc: 'false'

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: cargo-checks-v1
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cargo checks
        uses: ./.github/actions/cargo-check

  cooldown-check:
    name: Cargo cooldown check
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true'
      && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cooldown-check

  renovate-config-check:
    name: Renovate config check
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Renovate schema check
        run: npx --yes --package renovate -- renovate-config-validator renovate.json

      - name: Renovate extraction dry-run
        env:
          # Without a token, github-tags/github-releases lookups hit the
          # anonymous 60 req/hr rate limit shared across the runner IP.
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: debug
        run: npx --yes renovate --platform=local --dry-run=full

  build-and-test:
    needs: [changes, cooldown-check]
    # checks: write for the rust-unit-tests action's test-results check run.
    permissions:
      contents: read
      checks: write
      packages: read
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MacOS x86"
            runner: macos-15-intel
          - name: "MacOS arm64"
            runner: macos-15
          - name: "Linux x86 gnu"
            runner: ubuntu-24.04
            image: ghcr.io/nomicfoundation/solx-ci-runner@sha256:cd5a37f2630fdf1898ddb2ca11f8c2ecc4d572c60011fe923b27b1625f92ba15
            target: "x86_64-unknown-linux-gnu"
          - name: "Linux ARM64 gnu"
            runner: ubuntu-24.04-arm
            image: ghcr.io/nomicfoundation/solx-ci-runner@sha256:cd5a37f2630fdf1898ddb2ca11f8c2ecc4d572c60011fe923b27b1625f92ba15
            target: "aarch64-unknown-linux-gnu"
          - name: "Windows"
            runner: windows-2025
            target: "x86_64-pc-windows-gnu"
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image || '' }} # Special workaround to allow matrix builds with optional container
      # Host tooling bind-mounts for the free-disk-space-linux action. These apply
      # only when a container is started (matrix legs with `image:` set); the
      # macOS/Windows legs run bare and the paths are irrelevant there.
      volumes: *free-disk-volumes
    name: ${{ matrix.name }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # Only meaningful on containerized Linux legs (the hosted x86 leg is the
      # disk-constrained one); a no-op on macOS/Windows since the mount points
      # don't exist there.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux' && matrix.image != ''
        uses: ./.github/actions/free-disk-space-linux

      - name: Build toolchain
        uses: ./.github/actions/build-toolchain

      # bindgen's embedded clang needs to know it's targeting MinGW,
      # otherwise it can't parse MinGW-specific __attribute__ extensions
      # in stdlib.h (rust-lang/rust-bindgen#1760).
      - name: Set bindgen target for MinGW
        if: runner.os == 'Windows'
        shell: bash
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-w64-windows-gnu" >> "${GITHUB_ENV}"

      - name: Preserve lit tools before disk cleanup
        shell: bash
        run: |
          EXE=${{ runner.os == 'Windows' && '.exe' || '' }}
          LIT=llvm-lit${{ runner.os == 'Windows' && '.py' || '' }}
          mkdir -p "${RUNNER_TEMP}/lit-tools"
          cp -r \
            target-llvm/target-final/bin/FileCheck${EXE} \
            target-llvm/target-final/bin/${LIT} \
            solx-llvm/llvm/utils/lit \
            solx-solidity/build/solc/solc${EXE} \
            "${RUNNER_TEMP}/lit-tools/"
          echo "${RUNNER_TEMP}/lit-tools" >> "${GITHUB_PATH}"
          echo "PYTHONPATH=${RUNNER_TEMP}/lit-tools/lit" >> "${GITHUB_ENV}"

      - name: Free disk space (remove build artifacts before slang tests)
        shell: bash
        run: |
          echo "Before cleanup:" && df -h .
          rm -rf solx-llvm target-llvm/build-final target solx-solidity
          echo "After cleanup:" && df -h .

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: slang-tests-v2
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        uses: ./.github/actions/rust-unit-tests
        with:
          target: ${{ matrix.target || '' }}
          cargo-test-command: 'test-slang'

      - name: Verify lit tools run outside MSYS2
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -la "${RUNNER_TEMP}/lit-tools"
          FileCheck --version
          solc --version

      - name: Run MLIR lit tests
        shell: bash
        env:
          SOLX_LIT_TARGET: ${{ matrix.target || '' }}
        run: |
          LIT=llvm-lit${{ runner.os == 'Windows' && '.py' || '' }}
          # CMake bakes the configuring python's absolute path into the lit
          # shebang; runner image updates move it, so pick python3 from PATH.
          python3 "${RUNNER_TEMP}/lit-tools/${LIT}" -v solx-mlir/tests/lit/

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Official image bundles shellcheck + pyflakes, so `run:` linting needs no runner deps.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        env:
          # Gate on shellcheck warnings/errors; info-level style nits are noise.
          SHELLCHECK_OPTS: --severity=warning
        with:
          args: -color

  zizmor:
    name: Audit GitHub Actions security (zizmor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: zizmor@1.26.1
      # GH_TOKEN enables the online audits (known-vulnerabilities, tag->SHA resolution).
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --format github .github

  pr-checks:
    name: PR Checks (Tests)
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - changes
      - cargo-checks
      - build-and-test
      - cooldown-check
      - renovate-config-check
      - actionlint
      - zizmor
    steps:
      - name: Decide on PR checks
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            ${{
              needs.changes.outputs.code != 'true'
              && 'cargo-checks, build-and-test, cooldown-check, renovate-config-check'
              || github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
              && 'build-and-test, cooldown-check'
              || ''
            }}
