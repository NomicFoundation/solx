name: Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# Cancel the workflow if any new changes pushed to a feature branch or the trunk
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -ex {0}

jobs:

  label-check:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ci:integration')
      && (github.event.action != 'labeled'
        || contains(fromJSON('["ci:integration", "ci:integration-benchmark-full"]'), github.event.label.name))
      && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'

  cooldown-check:
    name: Cargo cooldown check
    runs-on: ubuntu-24.04
    needs: label-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/cooldown-check

  integration:
    needs: [label-check, cooldown-check]
    # Well above a cold full-matrix run (~4h with LLVM builds), well below the
    # 6h default that a single hung compile would otherwise squat the runner for.
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: write
      packages: read
    runs-on: solx-linux-amd64-self-hosted
    container:
      image: ghcr.io/nomicfoundation/solx-ci-runner@sha256:cd5a37f2630fdf1898ddb2ca11f8c2ecc4d572c60011fe923b27b1625f92ba15
      options: -m 110g
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          persist-credentials: false

      # actions/checkout's `git clean -ffdx` doesn't recurse into submodules,
      # so on a persistent self-hosted workspace a previous run can leave
      # stale artifacts inside temp-solx-main. Wipe wholesale before
      # re-checking out main-slang.
      - name: Reset main-slang checkout dir
        run: rm -rf temp-solx-main

      - name: Checkout main-slang
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: main-slang
          submodules: true
          persist-credentials: false
          path: temp-solx-main

      - name: Checkout submodules (PR)
        uses: ./.github/actions/checkout-submodules

      - name: Checkout submodules (main-slang)
        uses: ./.github/actions/checkout-submodules
        continue-on-error: true
        with:
          working-directory: temp-solx-main

      - name: Setup SFW (optional)
        uses: ./.github/actions/setup-sfw
        with:
          optional: 'true'

      - name: Build LLVM
        id: build-llvm-pr
        uses: ./.github/actions/build-llvm
        with:
          build-type: Release
          enable-assertions: 'false'
          enable-mlir: 'true'

      - name: Build LLVM (main-slang)
        uses: ./.github/actions/build-llvm
        continue-on-error: true
        with:
          working-dir: temp-solx-main
          mirror-key: ${{ steps.build-llvm-pr.outputs.cache-key }}
          build-type: Release
          enable-assertions: 'false'
          enable-mlir: 'true'

      - name: Fetch dependencies (PR)
        run: ${SFW_PREFIX:-} cargo fetch --locked

      - name: Build solx (PR)
        run: ${SFW_PREFIX:-} cargo build-slang --frozen --release

      - name: Build solx-dev and solx-tester (PR)
        run: ${SFW_PREFIX:-} cargo build --frozen --release -p solx-dev -p solx-tester --features solx-tester/slang-ast

      - name: Fetch dependencies (main-slang)
        working-directory: temp-solx-main
        continue-on-error: true
        run: ${SFW_PREFIX:-} cargo fetch --locked

      - name: Build solx (main-slang)
        working-directory: temp-solx-main
        continue-on-error: true
        run: ${SFW_PREFIX:-} cargo build-slang --frozen --release

      - name: Build solx-dev and solx-tester (main-slang)
        working-directory: temp-solx-main
        continue-on-error: true
        run: ${SFW_PREFIX:-} cargo build --frozen --release -p solx-dev -p solx-tester --features solx-tester/slang-ast

      - name: Run solx-tester tests (PR)
        id: solx_tester_tests
        continue-on-error: true
        run: ./target/release/solx-dev test solx-tester --solidity-compiler ./target/release/solx

      # When `ci:integration-benchmark-full` is present, enable every
      # otherwise-disabled compiler (solc, solx-latest) and its comparison
      # columns in the Foundry and Hardhat benchmark configs, so the reports
      # cover the full matrix instead of just solx (PR) vs solx-main. Scoped to
      # `[compilers.*]` and `[[comparisons]]`; disabled `[projects.*]` (hangs /
      # unsupported Solidity) are deliberately left off. Edits only this
      # throwaway CI checkout.
      - name: Enable full benchmark (all compilers + comparisons)
        if: contains(github.event.pull_request.labels.*.name, 'ci:integration-benchmark-full')
        run: |
          for cfg in solx-dev/foundry-tests.toml solx-dev/hardhat-tests.toml; do
            awk '
              /^\[/ { in_section = ($0 ~ /^\[compilers\./ || $0 ~ /^\[\[comparisons\]\]/) }
              in_section && $0 == "disabled = true" { $0 = "disabled = false" }
              { print }
            ' "$cfg" > "$cfg.tmp" && mv "$cfg.tmp" "$cfg"
          done

      - name: Run solx-tester benchmarks (main-slang)
        id: solx_tester_bench_main
        continue-on-error: true
        working-directory: temp-solx-main
        run: |
          ./target/release/solx-dev test solx-tester \
            --solidity-compiler ./target/release/solx \
            --optimizer 'M^B3' \
            --benchmark=../reference-benchmark.json

      - name: Run solx-tester benchmarks (PR)
        id: solx_tester_bench_pr
        continue-on-error: true
        run: |
          ./target/release/solx-dev test solx-tester \
            --solidity-compiler ./target/release/solx \
            --optimizer 'M^B3' \
            --benchmark=candidate-benchmark.json

      - name: Build benchmark converter
        id: build_converter
        run: ${SFW_PREFIX:-} cargo build --frozen --release --bin solx-benchmark-converter --bin solx-benchmark-summary

      # The XLSX comparison needs both sides; the summary JSON is written from
      # whatever exists, so a failed main-side baseline still yields PR data
      # (rendered as "no baseline") instead of a bogus "suite errored".
      # The jq toolchain names and the *-benchmark.json paths here are
      # interpreted by the summary crate (toolchain_matrix.rs tables, SuiteKind) —
      # renames must update both sides or every summary shows a harness error.
      # continue-on-error: a converter failure must not skip the Foundry and
      # Hardhat suites below (the summary would silently omit them as
      # "skipped"); the fail gate reports the converter outcome explicitly.
      - name: Run benchmark converter
        id: benchmark_converter
        continue-on-error: true
        if: hashFiles('candidate-benchmark.json') != ''
        run: |
          jq '{data: ., project: "solx-tester", toolchain: "01.solx"}' \
            candidate-benchmark.json > candidate.json
          inputs=(candidate.json)
          # The reference side is best-effort: a truncated or invalid baseline
          # (its bench step is continue-on-error) must not lose the healthy
          # candidate data, so its jq runs guarded and the summary JSON is
          # written before the two-sided XLSX conversion.
          if [ -s reference-benchmark.json ] && \
             jq '{data: ., project: "solx-tester", toolchain: "00.solx-main"}' \
               reference-benchmark.json > reference.json; then
            inputs=(reference.json candidate.json)
          fi
          ./target/release/solx-benchmark-converter \
            --output-format json \
            --output-path solx-tester-benchmark.json "${inputs[@]}"
          if [ ${#inputs[@]} -eq 2 ]; then
            ./target/release/solx-benchmark-converter \
              --output-path solx-tester-report.xlsx "${inputs[@]}"
          fi

      - name: Upload solx-tester report
        if: always() && hashFiles('solx-tester-report.xlsx') != ''
        id: solx-tester-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solx-tester-report
          path: solx-tester-report.xlsx

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # Pinning the action digest alone still floats the frontend: this input defaults to `stable`.
          # renovate: datasource=github-releases depName=foundry-rs/foundry
          version: v1.7.1

      # Some projects might use hardcoded ssh URLs: force git to use https instead.
      - name: Git https settings
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global url."https://".insteadOf git://

      - name: Run Hardhat tests
        id: hardhat_tests
        continue-on-error: true
        run: ./target/release/solx-dev test hardhat

      - name: Upload Hardhat report
        if: always() && hashFiles('temp-hardhat-reports/hardhat-report.xlsx') != ''
        id: hardhat-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardhat-report
          path: ./temp-hardhat-reports/hardhat-report.xlsx

      - name: Run Foundry tests
        id: foundry_tests
        continue-on-error: true
        run: ./target/release/solx-dev test foundry

      - name: Upload Foundry report
        if: always() && hashFiles('temp-foundry-reports/foundry-report.xlsx') != ''
        id: foundry-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-report
          path: ./temp-foundry-reports/foundry-report.xlsx

      # Every suite's step outcome is passed through: a skipped suite renders
      # an explicit "did not run" row (a partial run must never look complete),
      # a suite that ran but exited nonzero gets its data qualified, and a
      # suite that ran but produced no JSON renders as "errored".
      # The step skips when the converter build failed — the binary does not
      # exist to run — leaving the previous summary comment in place rather
      # than stacking a second red step on top of the real failure.
      # No continue-on-error: losing the summary must fail the job visibly.
      # !cancelled(), not always(): a run cancelled mid-suite (concurrency
      # auto-cancel on push) must not overwrite the last real summary with a
      # bogus "suite errored" row.
      - name: Generate integration summary
        if: ${{ !cancelled() && steps.build_converter.outcome == 'success' }}
        env:
          TESTER_URL: ${{ steps.solx-tester-report.outputs.artifact-url }}
          FOUNDRY_URL: ${{ steps.foundry-report.outputs.artifact-url }}
          HARDHAT_URL: ${{ steps.hardhat-report.outputs.artifact-url }}
          # The benchmark step narrows to one optimizer mode; correctness runs
          # the full matrix in solx_tester_tests. Reading only the benchmark
          # renders a green suite while the fail gate reddens the job on the
          # correctness step. Skipped stays skipped: without the benchmark step
          # there is no JSON to hand the summary below.
          TESTER_OUTCOME: ${{ steps.solx_tester_bench_pr.outcome == 'skipped' && 'skipped' || (steps.solx_tester_tests.outcome == 'failure' && 'failure' || steps.solx_tester_bench_pr.outcome) }}
          FOUNDRY_OUTCOME: ${{ steps.foundry_tests.outcome }}
          HARDHAT_OUTCOME: ${{ steps.hardhat_tests.outcome }}
        run: |
          args=(--tester-outcome "$TESTER_OUTCOME")
          args+=(--foundry-outcome "$FOUNDRY_OUTCOME")
          args+=(--hardhat-outcome "$HARDHAT_OUTCOME")
          if [ "$TESTER_OUTCOME" != "skipped" ]; then
            args+=(--tester solx-tester-benchmark.json --tester-url "$TESTER_URL")
          fi
          if [ "$FOUNDRY_OUTCOME" != "skipped" ]; then
            args+=(--foundry temp-foundry-reports/foundry-benchmark.json --foundry-url "$FOUNDRY_URL")
          fi
          if [ "$HARDHAT_OUTCOME" != "skipped" ]; then
            args+=(--hardhat temp-hardhat-reports/hardhat-benchmark.json --hardhat-url "$HARDHAT_URL")
          fi
          ./target/release/solx-benchmark-summary \
            --output-path integration-summary.md "${args[@]}"
          cat integration-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post integration summary comment
        if: ${{ !cancelled() && hashFiles('integration-summary.md') != '' }}
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: 'integration-test-summary'
          message-path: integration-summary.md

      # "failure", not != "success": a step skipped by an earlier hard
      # failure already reddens the job there — blaming the skipped suite
      # here would misattribute it.
      - name: Fail workflow if tests or benchmarks failed
        if: always()
        env:
          SOLX_TESTER_TESTS_OUTCOME: ${{ steps.solx_tester_tests.outcome }}
          SOLX_TESTER_BENCH_PR_OUTCOME: ${{ steps.solx_tester_bench_pr.outcome }}
          BENCHMARK_CONVERTER_OUTCOME: ${{ steps.benchmark_converter.outcome }}
          HARDHAT_TESTS_OUTCOME: ${{ steps.hardhat_tests.outcome }}
          FOUNDRY_TESTS_OUTCOME: ${{ steps.foundry_tests.outcome }}
        run: |
          failures=()
          if [ "${SOLX_TESTER_TESTS_OUTCOME}" = "failure" ]; then
            failures+=("solx-tester tests")
          fi
          if [ "${SOLX_TESTER_BENCH_PR_OUTCOME}" = "failure" ]; then
            failures+=("solx-tester benchmarks (PR)")
          fi
          if [ "${BENCHMARK_CONVERTER_OUTCOME}" = "failure" ]; then
            failures+=("benchmark converter")
          fi
          if [ "${HARDHAT_TESTS_OUTCOME}" = "failure" ]; then
            failures+=("hardhat tests")
          fi
          if [ "${FOUNDRY_TESTS_OUTCOME}" = "failure" ]; then
            failures+=("foundry tests")
          fi
          if [ ${#failures[@]} -ne 0 ]; then
            echo "Failures: ${failures[*]}"
            exit 1
          fi
