[package]
name = "solx-slang"
authors.workspace = true
edition.workspace = true
version.workspace = true
description = "Slang Solidity frontend for solx"
license = "MIT OR Apache-2.0"

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
hex.workspace = true
inkwell = { workspace = true, features = ["llvm21-1-no-llvm-linking"] }
melior.workspace = true
num.workspace = true
num-traits = "0.2"
rayon.workspace = true
ruint.workspace = true
serde_json.workspace = true
semver.workspace = true
thiserror.workspace = true

slang_solidity_v2.workspace = true

solx-mlir = { path = "../solx-mlir" }
solx-standard-json = { path = "../solx-standard-json" }
solx-utils = { path = "../solx-utils" }
